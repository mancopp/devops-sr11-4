- name: Install base packages
  ansible.builtin.apt:
    name: [ufw, git]
    update_cache: true
    cache_valid_time: 3600

- name: Harden SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/01-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
    mode: "0644"
    validate: sshd -t -f %s
  notify: Restart ssh

- name: Deny incoming traffic by default
  community.general.ufw:
    direction: incoming
    policy: deny

# Vagrant reaches the guest over the NAT network, a plain ssh from the host over the host-only one. VMware gives
# the host the first address of each network; allowing whole subnets would let the VMs SSH into each other.
- name: Allow SSH from the host only
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ item }}"
  loop:
    - "{{ host_ip }}"
    - "{{ ansible_default_ipv4.network | regex_replace('\\d+$', '1') }}"

- name: Allow host-specific ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: tcp
    from_ip: "{{ item.from }}"
  loop: "{{ ufw_rules | default([]) }}"

- name: Enable firewall
  community.general.ufw:
    state: enabled
