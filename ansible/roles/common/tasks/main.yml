- name: Install base packages
  ansible.builtin.apt:
    name: [ufw, git]
    update_cache: true
    cache_valid_time: 3600

- name: Harden SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/01-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
    mode: "0644"
    validate: sshd -t -f %s
  notify: Restart ssh

- name: Deny incoming traffic by default
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow host-specific ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: tcp
    from_ip: "{{ item.from }}"
  loop: "{{ ufw_rules | default([]) }}"

- name: Enable firewall
  community.general.ufw:
    state: enabled
